version: "3.9"

services:
  backend:
    build: ./backend
    image: data-analyst-ai-agent
    container_name: data-analyst-ai-backend
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: data-analyst-ai-frontend
    container_name: data-analyst-ai-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped